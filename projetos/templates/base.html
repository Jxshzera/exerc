{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/arquivo_com_estilos.css' %}">
    <title>{% block title %}Nome do meu App{% endblock title %}</title>
</head>
<body>

    <!--
    # A tag Django static permite localizar arquivos
    # dentro da estrutura de arquivos estaticos do projeto.
    # width e height definem respectivamente a largura e a altura da imagem.
    -->

    <!--
    # A imagem agora esta dentro de um link <a>.
    # Quando o usuario clicar na imagem, sera direcionado para
    # a pagina inicial do app, definida pela URL core:home.
    # Isso transforma a imagem em um botao visual para voltar ao inicio.
    -->
    <a href="{% url 'core:home' %}">
        <img src="{% static 'img/menu.png' %}" width="200" height="60" />
    </a>
    <br />

    <!--
    # 6.2 - Integração com JavaScript
    # O atributo onclick executa uma função JavaScript quando
    # o usuário clicar no botão.
    # Categorias chama mudarCor().
    # Produtos possui uma página funcional e utiliza sua URL.
    # Clientes e Pedidos ainda não possuem páginas funcionais,
    # por isso continuam utilizando href="#" e alertarMensagem().
    -->
    <a href="{% url 'categories:list_categories' %}" ><button onclick="mudarCor()">Categorias</button></a>
    <a href="{% url 'products:list_products' %}" ><button onclick="alertarMensagem()">Produtos</button></a>
    <a href="#" ><button onclick="alertarMensagem()">Clientes</button></a>
    <a href="#" ><button onclick="alertarMensagem()">Pedidos</button></a>
    <br />

    {% block body %}
    
    {% endblock body %}
    
    <script src="{% static 'js/arquivo_com_javascript.js' %}"></script>
</body>
</html>
