
{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/arquivo_com_estilos.css' %}">
    <title>{% block title %}Nome do meu App{% endblock title %}</title>
</head>
<body>

    <!--
    # A tag Django static permite localizar arquivos
    # dentro da estrutura de arquivos estaticos do projeto.
    # width e height definem respectivamente a largura e a altura da imagem.
    -->

    <!--
    # A imagem agora esta dentro de um link <a>.
    # Quando o usuario clicar na imagem, sera direcionado para
    # a pagina inicial do app, definida pela URL core:home.
    # Isso transforma a imagem em um botao visual para voltar ao inicio.
    -->
    <a href="{% url 'core:home' %}">
        <img src="{% static 'img/menu.png' %}" width="200" height="60" />
    </a>
    <br />

    <!--
    # 6.2 - Integracao com JavaScript
    # O atributo onclick executa uma funcao JavaScript quando
    # o usuario clicar no botao.
    # Categorias chama mudarCor().
    # Produtos utiliza sua URL funcional.
    # Clientes abre a listagem de clientes.
    # Pedidos abre a listagem de pedidos cadastrados.
    # Compras abre a lista de produtos disponiveis para compra.
    -->
    <a href="{% url 'categories:list_categories' %}">
        <button onclick="mudarCor()">Categorias</button>
    </a>

    <a href="{% url 'products:list_products' %}">
        <button onclick="alertarMensagem()">Produtos</button>
    </a>

    <a href="{% url 'clients:list_clients' %}">
        <button>Clientes</button>
    </a>

    <a href="{% url 'orders:list_orders' %}">
        <button>Pedidos</button>
    </a>

    <a href="{% url 'socialnetworks:list_socialnetworks' %}">
        <button>Redes Sociais</button>
    </a>

    <a href="{% url 'employees:list_employees' %}">
        <button>Funcionários</button>
    </a>

    <a href="{% url 'orders:list_items_products' %}">
        <button>Compras</button>
    </a>

    <br />

    <!-- Formulario para buscar clientes pelo sobrenome. -->
    <form action="{% url 'clients:search_clients' %}" method="GET">
        <input name="query" type="text" placeholder="Sobrenome do cliente" aria-label="Buscar">
        <button type="submit">Buscar</button>
    </form>

    <!--
    # Bloco responsavel por exibir o conteudo especifico
    # de cada pagina que utiliza este template base.
    # Os templates antigos utilizam body e os novos utilizam content.
    -->
    {% block body %}
        {% block content %}
        {% endblock content %}
    {% endblock body %}

    <script src="{% static 'js/arquivo_com_javascript.js' %}"></script>
</body>
</html>
